name: Benchmark

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run benchmarks
        # Strip the MB/s column: github-action-benchmark treats every metric
        # as lower-is-better, so throughput improvements trip the alert (and
        # real throughput drops never would). ns/op tracks the same
        # benchmarks with correct direction.
        run: go test -bench=. ./parser/ ./scanner/ | sed -E 's|[[:space:]]+[0-9.]+ MB/s||' | tee output.txt
      - name: Download previous benchmark data
        uses: actions/cache@v5
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-v2
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: go
          output-file-path: output.txt
          external-data-json-path: ./cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '150%'
          fail-on-alert: true
          comment-on-alert: true
